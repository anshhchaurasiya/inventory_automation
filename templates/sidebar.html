<style>
    :root {
        --sidebar-width: 250px;
        --topbar-height: 64px;

        --sidebar-bg: #172033;
        --sidebar-hover: #26344d;
        --sidebar-active: #33445f;
        --sidebar-text: #d3dbe7;
        --sidebar-muted: #aab6c8;

        --navbar-bg: #172033;
        --navbar-border: #26344d;
        --navbar-text: #ffffff;
    }

    /* =========================
       FIXED SIDEBAR
       ========================= */
    .sidebar {
        position: fixed !important;
        top: var(--topbar-height) !important;
        left: 0 !important;
        bottom: 0 !important;

        width: var(--sidebar-width) !important;
        min-width: var(--sidebar-width) !important;
        max-width: var(--sidebar-width) !important;
        height: calc(100vh - var(--topbar-height)) !important;

        margin: 0 !important;
        padding: 22px 14px !important;
        box-sizing: border-box !important;

        background: var(--sidebar-bg) !important;
        color: #fff !important;

        overflow-x: hidden !important;
        overflow-y: auto !important;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;

        transform: none !important;
        transition: none !important;
        z-index: 1000 !important;

        font-family: Arial, sans-serif !important;
        font-size: 14px !important;
        line-height: normal !important;
    }

    /* Brand appears in the navbar, not in the sidebar */
    .sidebar .sidebar-brand {
        display: none !important;
    }

    .sidebar .menu-title {
        display: block !important;
        margin: 25px 12px 10px !important;
        padding: 0 !important;

        color: var(--sidebar-muted) !important;
        font-family: Arial, sans-serif !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        line-height: 14px !important;
        letter-spacing: 1.2px !important;
        text-transform: none !important;

        transform: none !important;
    }

    .sidebar a.menu-link,
    .sidebar a.menu-link:link,
    .sidebar a.menu-link:visited,
    .sidebar a.menu-link:hover,
    .sidebar a.menu-link:focus,
    .sidebar a.menu-link:active,
    .sidebar a.menu-link.active {
        display: flex !important;
        align-items: center !important;

        width: 100% !important;
        min-height: 42px !important;
        height: 42px !important;

        margin: 0 0 4px !important;
        padding: 0 13px !important;
        box-sizing: border-box !important;

        gap: 13px !important;
        border: 0 !important;
        border-radius: 8px !important;

        font-family: Arial, sans-serif !important;
        font-size: 14px !important;
        font-weight: 400 !important;
        line-height: 20px !important;
        text-decoration: none !important;
        text-transform: none !important;
        white-space: nowrap !important;

        color: var(--sidebar-text) !important;
        background: transparent !important;

        transform: none !important;
        transition: background-color 0.15s ease, color 0.15s ease !important;
    }

    .sidebar a.menu-link svg {
        display: block !important;
        width: 18px !important;
        min-width: 18px !important;
        height: 18px !important;
        min-height: 18px !important;
        flex: 0 0 18px !important;

        color: var(--sidebar-muted) !important;
        transform: none !important;
    }

    .sidebar a.menu-link:hover,
    .sidebar a.menu-link:focus-visible {
        background: var(--sidebar-hover) !important;
        color: #fff !important;
    }

    .sidebar a.menu-link:hover svg,
    .sidebar a.menu-link:focus-visible svg,
    .sidebar a.menu-link.active svg {
        color: #fff !important;
    }

    .sidebar a.menu-link.active {
        background: var(--sidebar-active) !important;
        color: #fff !important;
    }

    /* =========================
       FIXED LIGHT NAVBAR
       ========================= */
    .top-navbar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;

        width: 100% !important;
        height: var(--topbar-height) !important;
        min-height: var(--topbar-height) !important;
        max-height: var(--topbar-height) !important;

        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;

        margin: 0 !important;
        padding: 0 28px !important;
        box-sizing: border-box !important;

        background: var(--navbar-bg) !important;
        color: var(--navbar-text) !important;
        border: 0 !important;
        border-bottom: 1px solid var(--navbar-border) !important;

        transform: none !important;
        transition: none !important;
        z-index: 1100 !important;

        font-family: Arial, sans-serif !important;
    }

    .topbar-brand {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;

        color: var(--navbar-text) !important;
        font-family: Arial, sans-serif !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        line-height: 20px !important;
        white-space: nowrap !important;
    }

    .topbar-actions {
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;

        margin: 0 !important;
        padding: 0 !important;
    }

    .topbar-icon-btn {
        position: relative !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;

        width: 38px !important;
        min-width: 38px !important;
        height: 38px !important;
        min-height: 38px !important;

        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;

        border: 1px solid #e2e8f0 !important;
        border-radius: 9px !important;
        background: #fff !important;
        color: #475569 !important;

        cursor: pointer !important;
        text-decoration: none !important;
        transform: none !important;
    }

    .topbar-icon-btn:hover {
        background: #f1f5f9 !important;
    }

    .topbar-icon-btn svg {
        width: 19px !important;
        height: 19px !important;
    }

    .notification-dot {
        position: absolute !important;
        top: 7px !important;
        right: 7px !important;

        width: 7px !important;
        height: 7px !important;

        border: 1px solid #fff !important;
        border-radius: 50% !important;
        background: #ef4444 !important;
    }

    .profile-btn,
    .profile-btn:link,
    .profile-btn:visited,
    .profile-btn:hover,
    .profile-btn:focus {
        display: inline-flex !important;
        align-items: center !important;
        gap: 8px !important;

        height: 38px !important;
        min-height: 38px !important;
        margin: 0 !important;
        padding: 0 11px !important;
        box-sizing: border-box !important;

        border: 1px solid #e2e8f0 !important;
        border-radius: 9px !important;
        background: #fff !important;
        color: #334155 !important;

        font-family: Arial, sans-serif !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        line-height: normal !important;
        text-decoration: none !important;

        transform: none !important;
    }

    .profile-btn:hover {
        background: #f1f5f9 !important;
    }

    .profile-avatar {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;

        width: 25px !important;
        min-width: 25px !important;
        height: 25px !important;
        min-height: 25px !important;

        border-radius: 50% !important;
        background: #e9edf3 !important;
        color: #334155 !important;

        font-family: Arial, sans-serif !important;
        font-size: 11px !important;
        font-weight: 700 !important;
    }

    .logout-btn,
    .logout-btn:link,
    .logout-btn:visited,
    .logout-btn:hover,
    .logout-btn:focus {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 7px !important;

        height: 38px !important;
        min-height: 38px !important;
        margin: 0 !important;
        padding: 0 12px !important;
        box-sizing: border-box !important;

        border: 1px solid #e2e8f0 !important;
        border-radius: 9px !important;
        background: #fff !important;
        color: #475569 !important;

        font-family: Arial, sans-serif !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        line-height: normal !important;
        text-decoration: none !important;

        transform: none !important;
    }

    .logout-btn:hover {
        background: #fef2f2 !important;
        border-color: #fecaca !important;
        color: #b91c1c !important;
    }

    .logout-btn svg {
        width: 17px !important;
        height: 17px !important;
        flex: 0 0 17px !important;
    }

    /* =========================
       PAGE CONTENT POSITION
       ========================= */
    .main-content {
        margin-left: var(--sidebar-width) !important;
        padding: calc(var(--topbar-height) + 28px) 28px 28px !important;
        min-height: 100vh !important;
        box-sizing: border-box !important;
    }

    .topbar-icon-btn,
    .profile-btn,
    .logout-btn {
        background: #26344d !important;
        border-color: #3b4a62 !important;
        color: #ffffff !important;
    }

    .profile-avatar {
        background: #3b4a62 !important;
        color: #ffffff !important;
    }

    .topbar-icon-btn:hover,
    .profile-btn:hover {
        background: #33445f !important;
    }

    .logout-btn:hover {
        background: #7f1d1d !important;
        border-color: #991b1b !important;
        color: #ffffff !important;
    }

    .topbar-brand {
        color: #ffffff !important;
    }

    /* Mobile sizing */
    @media (max-width: 768px) {
        :root {
            --sidebar-width: 210px;
        }

        .top-navbar {
            padding: 0 14px !important;
        }

        .main-content {
            padding-left: 16px !important;
            padding-right: 16px !important;
        }

        .profile-btn .profile-name,
        .logout-btn .logout-text {
            display: none !important;
        }
    }
</style>
