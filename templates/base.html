<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Inventory Automation{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }
    </style>

    {% block extra_css %}{% endblock %}

</head>
<body>

    <!-- Sidebar -->
    {% include 'sidebar.html' %}

    <!-- Page Content -->
    <div class="main-content">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
