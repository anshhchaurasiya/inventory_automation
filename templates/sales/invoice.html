
{% extends 'base.html' %}

{% block title %}Purchase Invoice{% endblock %}

{% block extra_css %}

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f3f5;
    color: #222;
    padding: 32px 16px;
    font-size: 13px;
}

.invoice-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 42px 48px;
    background: #fff;
    border: 1px solid #e1e4e8;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
}

/* Invoice heading */
.top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 2px solid #222;
}

.brand h1 {
    font-size: 30px;
    letter-spacing: 1.5px;
    color: #111;
    font-weight: 800;
}

.brand p {
    margin-top: 6px;
    color: #777;
    font-size: 12px;
}

.invoice-heading {
    text-align: right;
}

.invoice-heading h2 {
    font-size: 25px;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 10px;
}

.invoice-heading p {
    margin: 5px 0;
    color: #555;
    font-size: 12px;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border-radius: 3px;
    background: #edf7f0;
    color: #247443;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Section headings and details */
.section {
    margin-top: 28px;
}

.section-title {
    margin-bottom: 12px;
    color: #333;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.detail-box {
    height: 100%;
    padding: 16px 18px;
    border: 1px solid #e2e5e8;
    border-radius: 4px;
    background: #fff;
}

.detail-box p {
    margin: 7px 0;
    color: #444;
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.detail-box strong {
    color: #222;
}

/* Products table */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

thead {
    display: table-header-group;
}

th {
    padding: 12px 10px;
    background: #f4f5f6;
    border-top: 1px solid #d9dde1;
    border-bottom: 1px solid #cfd4d9;
    color: #333;
    font-size: 11px;
    font-weight: 700;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}

td {
    padding: 13px 10px;
    border-bottom: 1px solid #e5e7e9;
    color: #333;
    font-size: 12px;
    vertical-align: top;
}

.text-right {
    text-align: right;
    white-space: nowrap;
}

.product-name {
    color: #222;
    font-weight: 600;
}

.sku {
    margin-top: 4px;
    color: #777;
    font-size: 10px;
}

/* Totals */
.summary {
    display: flex;
    justify-content: flex-end;
    margin-top: 22px;
}

.summary-box {
    width: 290px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 8px 0;
    color: #555;
    font-size: 12px;
}

.summary-row strong {
    color: #222;
}

.total-row {
    margin-top: 5px;
    padding-top: 13px;
    border-top: 2px solid #222;
    color: #111;
    font-size: 16px;
    font-weight: 700;
}

.total-row span:last-child {
    color: #111;
}

/* Payment and notes */
.payment-box {
    padding: 15px 17px;
    border: 1px solid #e2e5e8;
    border-radius: 4px;
    background: #fff;
    color: #444;
    font-size: 12px;
    line-height: 1.6;
}

.notes {
    margin-top: 8px;
    color: #555;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.footer {
    margin-top: 34px;
    padding-top: 17px;
    border-top: 1px solid #d9dde1;
    color: #666;
    font-size: 11px;
    line-height: 1.7;
    text-align: center;
}

/* Print / Save as PDF */
.actions {
    max-width: 900px;
    margin: 18px auto 0;
    display: flex;
    justify-content: flex-end;
}

button {
    padding: 11px 18px;
    border: 0;
    border-radius: 5px;
    background: #303030;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

button:hover {
    background: #1f1f1f;
}

.error {
    max-width: 900px;
    margin: 50px auto;
    padding: 30px;
    background: #fff;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    color: #b42318;
    text-align: center;
}

/* Responsive screen layout */
@media (max-width: 650px) {
    body {
        padding: 12px 8px;
    }

    .invoice-container {
        padding: 24px 16px;
    }

    .top-section {
        flex-direction: column;
        gap: 18px;
    }

    .invoice-heading {
        text-align: left;
    }

    .details-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .summary-box {
        width: 100%;
    }

    .actions {
        padding: 0 8px;
    }
}

/* Clean A4 invoice output */
@media print {
    @page {
        size: A4;
        margin: 12mm;
    }

    html,
    body {
        width: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #111;
        font-size: 11px;
    }

    .sidebar,
    .actions {
        display: none !important;
    }

    .main-content {
        margin: 0 !important;
        padding: 0 !important;
        min-height: 0 !important;
        width: 100% !important;
    }

    .invoice-container {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
    }

    .top-section {
        padding-bottom: 16px;
        border-bottom: 1.5px solid #222;
        break-inside: avoid;
    }

    .section {
        margin-top: 20px;
        break-inside: avoid;
    }

    .details-grid {
        gap: 14px;
    }

    .detail-box,
    .payment-box {
        padding: 12px;
        background: #fff !important;
        border: 1px solid #d9dde1;
    }

    .table-wrapper {
        overflow: visible !important;
    }

    table {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed;
    }

    th,
    td {
        padding: 8px 7px;
        font-size: 10px;
        overflow-wrap: anywhere;
    }

    tr {
        break-inside: avoid;
    }

    .summary {
        margin-top: 16px;
        break-inside: avoid;
    }

    .summary-box {
        width: 260px;
    }

    .status,
    th {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }

    .footer {
        margin-top: 24px;
        padding-top: 12px;
    }
}
</style>
{% endblock %}


{% block content %}

<div id="invoiceContent"></div>

<script>

    // Get purchase data from sessionStorage
    const purchaseData = sessionStorage.getItem("invoiceData");

    const container = document.getElementById("invoiceContent");

    if (!purchaseData) {

        container.innerHTML = `
            <div class="error">
                <h2>Invoice Data Not Found</h2>
                <p>Please complete a purchase before opening the invoice.</p>
            </div>
        `;

    } else {

        try {
            const data = JSON.parse(purchaseData);
            renderInvoice(data);

        } catch (error) {

            container.innerHTML = `
                <div class="error">
                    <h2>Invalid Invoice Data</h2>
                    <p>Unable to load the purchase details.</p>
                </div>
            `;
        }
    }


    function formatCurrency(amount) {

        return new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR"
        }).format(Number(amount || 0));
    }


    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, function(char) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];

        });
    }


    function renderInvoice(data) {

        const customerType = String(data.customer_type || "").toLowerCase();
        const isBusiness = customerType === "business";

        const purchaseDate = data.purchase_date
            ? new Date(data.purchase_date).toLocaleString("en-IN", {
                dateStyle: "medium",
                timeStyle: "short"
            })
            : "Not available";

        const items = Array.isArray(data.items) ? data.items : [];

        const productRows = items.map(item => `

            <tr>

                <td>
                    <div class="product-name">
                        ${escapeHTML(item.product_name)}
                    </div>

                    <div class="sku">
                        SKU: ${escapeHTML(item.sku)}
                    </div>
                </td>

                <td class="text-right">
                    ${escapeHTML(item.quantity)}
                </td>

                <td class="text-right">
                    ${formatCurrency(item.unit_price)}
                </td>

                <td class="text-right">
                    ${formatCurrency(item.subtotal)}
                </td>

            </tr>

        `).join("");


        container.innerHTML = `

            <div class="invoice-container">

                <div class="top-section">

                    <div class="brand">
                        <h1>INVOICE</h1>
                        <p>Purchase Transaction Details</p>
                    </div>

                    <div class="invoice-heading">

                        <h2>INVOICE</h2>

                        <p>
                            <strong>Invoice ID:</strong>
                            #${escapeHTML(data.id)}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${escapeHTML(purchaseDate)}
                        </p>

                        <span class="status">
                            ${escapeHTML(data.status)}
                        </span>

                    </div>

                </div>


                <div class="section details-grid">

                    <div>

                        <h3 class="section-title">Customer Details</h3>

                        <div class="detail-box">

                            <p>
                                <strong>Name:</strong>
                                ${escapeHTML(data.customer_name)}
                            </p>

                            <p>
                                <strong>Phone:</strong>
                                ${escapeHTML(data.phone)}
                            </p>

                            <p>
                                <strong>Email:</strong>
                                ${escapeHTML(data.email)}
                            </p>

                            <p>
                                <strong>Customer Type:</strong>
                                ${escapeHTML(data.customer_type)}
                            </p>

                            <div class="business-details"
                                 style="display: ${isBusiness ? "block" : "none"}">

                                <p>
                                    <strong>Company:</strong>
                                    ${escapeHTML(data.company_name)}
                                </p>

                                <p>
                                    <strong>GSTIN:</strong>
                                    ${escapeHTML(data.gstin)}
                                </p>

                            </div>

                        </div>

                    </div>


                    <div>

                        <h3 class="section-title">Billing Address</h3>

                        <div class="detail-box">

                            <p>
                                ${escapeHTML(data.address).replace(/\n/g, "<br>")}
                            </p>

                            <p>
                                ${escapeHTML(data.city)},
                                ${escapeHTML(data.state)}
                            </p>

                            <p>
                                <strong>Pincode:</strong>
                                ${escapeHTML(data.pincode)}
                            </p>

                        </div>

                    </div>

                </div>


                <div class="section">

                    <h3 class="section-title">Purchased Products</h3>

                    <div class="table-wrapper">

                        <table>

                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th class="text-right">Qty</th>
                                    <th class="text-right">Unit Price</th>
                                    <th class="text-right">Subtotal</th>
                                </tr>
                            </thead>

                            <tbody>

                                ${productRows || `
                                    <tr>
                                        <td colspan="4">No products found.</td>
                                    </tr>
                                `}

                            </tbody>

                        </table>

                    </div>

                </div>


                <div class="summary">

                    <div class="summary-box">

                        <div class="summary-row">

                            <span>Total Items</span>

                            <strong>
                                ${items.reduce((sum, item) =>
                                    sum + Number(item.quantity || 0), 0)}
                            </strong>

                        </div>

                        <div class="summary-row total-row">

                            <span>Grand Total</span>

                            <span>
                                ${formatCurrency(data.total_amount)}
                            </span>

                        </div>

                    </div>

                </div>


                <div class="section">

                    <h3 class="section-title">Payment Details</h3>

                    <div class="payment-box">

                        <strong>Payment Method:</strong>
                        ${escapeHTML(data.payment_method)}

                    </div>

                </div>


                ${data.notes ? `

                    <div class="section">

                        <h3 class="section-title">Additional Notes</h3>

                        <div class="notes">
                            ${escapeHTML(data.notes)}
                        </div>

                    </div>

                ` : ""}


                <div class="footer">

                    <p>Thank you for your purchase!</p>

                    <p>
                        This invoice represents your completed purchase transaction.
                    </p>

                </div>

            </div>


            <div class="actions">

                <button class="print-btn" onclick="window.print()">
                    Print / Save as PDF
                </button>

            </div>

        `;
    }

</script>

{% endblock %}
